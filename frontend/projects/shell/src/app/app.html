<div class="bg-background text-foreground flex min-h-dvh flex-col">
  <header class="bg-background/80 sticky top-0 z-40 border-b backdrop-blur">
    <div class="mx-auto flex h-14 w-full max-w-5xl items-center gap-3 px-4 sm:gap-6">
      <a routerLink="/users" class="flex items-center gap-2">
        <span class="bg-primary text-primary-foreground flex size-7 shrink-0 items-center justify-center rounded-md">
          <ng-icon name="lucideHexagon" class="text-sm" />
        </span>
        <span class="flex flex-col leading-none">
          <span class="text-sm font-semibold">{{ 'shell.title' | transloco }}</span>
          <span class="text-muted-foreground hidden text-[11px] sm:block">{{ 'shell.subtitle' | transloco }}</span>
        </span>
      </a>

      <nav class="flex items-center gap-1" [attr.aria-label]="'common.appName' | transloco">
        <a
          routerLink="/users"
          routerLinkActive="bg-secondary text-secondary-foreground"
          class="text-muted-foreground hover:text-foreground hover:bg-muted/60 flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-colors"
        >
          <ng-icon name="lucideUsers" class="text-base" />
          <span>{{ 'shell.navUsers' | transloco }}</span>
        </a>
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-secondary text-secondary-foreground"
          class="text-muted-foreground hover:text-foreground hover:bg-muted/60 flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-colors"
        >
          <ng-icon name="lucideLayoutDashboard" class="text-base" />
          <span>{{ 'shell.navDashboard' | transloco }}</span>
        </a>
      </nav>

      <div class="ms-auto">
        <app-language-switcher />
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    <router-outlet />
  </main>

  <footer class="text-muted-foreground border-t px-4 py-4 text-center text-xs">
    {{ 'shell.title' | transloco }} · NestJS + Angular + Native Federation
  </footer>

  <hlm-toaster [richColors]="true" />
</div>
