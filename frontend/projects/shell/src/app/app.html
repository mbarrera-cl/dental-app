<div class="bg-background text-foreground flex min-h-dvh flex-col">
  <header class="bg-background/80 sticky top-0 z-40 border-b backdrop-blur">
    <div class="flex h-14 w-full items-center gap-3 px-4 sm:gap-4">
      @if (store.isAuthenticated()) {
        <button
          type="button"
          class="text-muted-foreground hover:bg-muted/60 hover:text-foreground -ms-1 rounded-md p-1.5 md:hidden"
          [attr.aria-label]="'shell.openMenu' | transloco"
          (click)="navigation.openMobile()"
        >
          <ng-icon name="lucideMenu" class="text-lg" />
        </button>
      }

      <a routerLink="/" class="flex items-center gap-2">
        <span class="bg-primary text-primary-foreground flex size-7 shrink-0 items-center justify-center rounded-md">
          <ng-icon name="lucideHexagon" class="text-sm" />
        </span>
        <span class="flex flex-col leading-none">
          <span class="text-sm font-semibold">{{ 'shell.title' | transloco }}</span>
          <span class="text-muted-foreground hidden text-[11px] sm:block">{{ 'shell.subtitle' | transloco }}</span>
        </span>
      </a>

      <div class="ms-auto flex items-center gap-2">
        <app-language-switcher />
        @if (store.isAuthenticated()) {
          <app-user-menu />
        } @else {
          <a hlmBtn variant="outline" size="sm" routerLink="/login">{{ 'shell.signIn' | transloco }}</a>
        }
      </div>
    </div>
  </header>

  <div class="flex min-w-0 flex-1">
    @if (store.isAuthenticated()) {
      <app-sidebar />
    }

    <main class="mx-auto w-full max-w-5xl min-w-0 flex-1 px-4 py-8">
      <router-outlet />
    </main>
  </div>

  <footer class="text-muted-foreground border-t px-4 py-4 text-center text-xs">
    {{ 'shell.title' | transloco }} · NestJS + Angular + Native Federation
  </footer>

  <hlm-toaster [richColors]="true" />
</div>
